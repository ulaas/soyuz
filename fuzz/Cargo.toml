# cargo-fuzz targets for every parser that reads untrusted data.
#
# A separate workspace (excluded from the main one). Running needs nightly + cargo-fuzz:
#   cargo install cargo-fuzz
#   cd fuzz && cargo +nightly fuzz run lnk            # or any target below
#   cargo +nightly fuzz list
# On stable, `cargo check --manifest-path fuzz/Cargo.toml` verifies the targets compile.
# The parsers are exposed by the crates' `fuzzing` features (`soyuz_fs::fuzzing`,
# `soyuz_archive::fuzzing`, `soyuz_term::fuzzing`,
# `soyuz_mcp::fuzzing`); the app's media / tag / EXIF parsers
# are public already.
[package]
name = "soyuz-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.13"
soyuz-fs = { path = "../crates/soyuz-fs", features = ["fuzzing"] }
soyuz-archive = { path = "../crates/soyuz-archive", features = ["fuzzing"] }
soyuz-term = { path = "../crates/soyuz-term", features = ["fuzzing"] }
soyuz-mcp = { path = "../crates/soyuz-mcp", features = ["fuzzing"] }
soyuz-app = { path = "../crates/soyuz-app", default-features = false }

[profile.release]
debug = 1

[[bin]]
name = "lnk"
path = "fuzz_targets/lnk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recycle_i"
path = "fuzz_targets/recycle_i.rs"
test = false
doc = false
bench = false

