# Flatpak manifest for Soyuz (docs/RELEASING.md, "Flatpak").
#
# Build and install for the current user, from the repository root:
#
#   installer/linux/flatpak/gen-cargo-sources.sh          # writes cargo-sources.json
#   flatpak-builder --user --install --force-clean build-dir \
#       installer/linux/flatpak/io.github.ulaas.Soyuz.yml
#   flatpak run io.github.ulaas.Soyuz
#   flatpak run --command=soyuz-tui io.github.ulaas.Soyuz [PATH]   # the terminal UI
#
# The build is offline: every crate in Cargo.lock comes from cargo-sources.json
# (generated by flatpak-cargo-generator, not checked in), the workspace itself from this
# checkout. Needs org.freedesktop.Platform / Sdk 25.08 and
# org.freedesktop.Sdk.Extension.rust-stable//25.08.
#
# Names: Flatpak exports only files named after the app id, so the desktop entry, icons
# and metainfo are installed as io.github.ulaas.Soyuz.*. The window's Wayland app_id /
# X11 WM_CLASS stays `soyuz` (crates/soyuz-app/src/main.rs) and the desktop entry keeps
# StartupWMClass=soyuz, which GNOME Shell and KDE Plasma use to match the window to the
# launcher when app_id and desktop id differ.

id: io.github.ulaas.Soyuz
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: soyuz

finish-args:
  # Display: Wayland first, X11 (XWayland or a plain X session) only when there is no
  # Wayland socket. X11 needs the shared IPC namespace (MIT-SHM).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU for the wgpu (Vulkan / GL) renderer.
  - --device=dri
  # Audio previews (rodio over ALSA, routed to PipeWire / PulseAudio by the runtime).
  - --socket=pulseaudio
  # Remote locations (SFTP, WebDAV, FTP(S), S3, SMB), AI providers and the update check.
  # Inside Flatpak the update check only notifies (services/updates.rs, InstallKind::Flatpak):
  # updates come from `flatpak update`.
  - --share=network
  # SFTP: keys from the user's ssh-agent.
  - --socket=ssh-auth
  # It is a file manager: the whole host file system except the paths Flatpak reserves
  # (/usr, /etc, … of the host are visible read-only under /run/host). Includes $HOME,
  # /mnt, /media, /run/media (removable drives), /opt, /srv.
  - --filesystem=host
  # GNOME gvfs FUSE mounts (SMB / SFTP / MTP shares mounted by the desktop) live under
  # $XDG_RUNTIME_DIR, which `host` does not cover. Read-write so files can be copied to
  # such shares.
  - --filesystem=xdg-run/gvfs
  # The shared freedesktop thumbnail cache (~/.cache/thumbnails): read, and written back
  # so other apps reuse Soyuz's thumbnails. Already inside `host`; listed so the cache
  # keeps working if `host` is narrowed (e.g. with Flatseal) to `home`.
  - --filesystem=xdg-cache/thumbnails
  # Secret Service (gnome-keyring / KWallet): passwords for remote locations and AI
  # provider API keys (never written to config.toml).
  - --talk-name=org.freedesktop.secrets
  # Devices in the sidebar: mount, unmount, unlock, eject and power off through UDisks2.
  - --system-talk-name=org.freedesktop.UDisks2
  # "Show in folder" hands the item to the desktop's file manager.
  - --talk-name=org.freedesktop.FileManager1
  # Opt-in only ([linux] own_file_manager1 / "default file manager" in Settings): serve
  # "show in folder" for other apps. Flatpak permissions are static, so the name is
  # granted here; Soyuz requests it only while that setting is on.
  - --own-name=org.freedesktop.FileManager1
  # `flatpak-spawn --host`: open an external terminal and run "Open with" applications
  # on the host (they are not inside this sandbox). Opening files with their default
  # app needs no permission: it goes through the OpenURI portal.
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: soyuz
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        # The vendored crates and the source-replacement config written by
        # cargo-sources.json (flatpak-cargo-generator) live under cargo/.
        CARGO_HOME: /run/build/soyuz/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      # rust-toolchain.toml is ignored here (no rustup): the rust-stable extension's
      # cargo must be at least the workspace's rust-version.
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked -p soyuz-app -p soyuz-tui
      - install -Dm755 target/release/soyuz /app/bin/soyuz
      # The terminal UI (`flatpak run --command=soyuz-tui io.github.ulaas.Soyuz`).
      - install -Dm755 target/release/soyuz-tui /app/bin/soyuz-tui
      # Desktop entry, renamed to the app id; Icon= follows. Flatpak rewrites Exec= to
      # `flatpak run` on export.
      - install -Dm644 crates/soyuz-app/assets/soyuz.desktop /app/share/applications/io.github.ulaas.Soyuz.desktop
      - sed -i 's/^Icon=soyuz$/Icon=io.github.ulaas.Soyuz/' /app/share/applications/io.github.ulaas.Soyuz.desktop
      # Icons: every hicolor size, renamed.
      - |
        for s in 16 22 24 32 48 64 128 256 512; do
          install -Dm644 installer/linux/icons/hicolor/${s}x${s}/apps/soyuz.png \
            /app/share/icons/hicolor/${s}x${s}/apps/io.github.ulaas.Soyuz.png
        done
      # AppStream metadata; <launchable> names the renamed desktop entry.
      - install -Dm644 installer/linux/io.github.ulaas.Soyuz.metainfo.xml /app/share/metainfo/io.github.ulaas.Soyuz.metainfo.xml
      - >-
        sed -i 's|<launchable type="desktop-id">soyuz.desktop</launchable>|<launchable type="desktop-id">io.github.ulaas.Soyuz.desktop</launchable>|'
        /app/share/metainfo/io.github.ulaas.Soyuz.metainfo.xml
      - install -Dm644 -t /app/share/licenses/io.github.ulaas.Soyuz LICENSE THIRD-PARTY-NOTICES.md
    sources:
      # This checkout (the manifest sits three levels below the repository root).
      - type: dir
        path: ../../..
        skip:
          - .git
          - target
          - dist
          - build-dir
          - .flatpak-builder
          - .claude
          - portable-data
          - site
          - fuzz/corpus
          - fuzz/artifacts
      - cargo-sources.json
