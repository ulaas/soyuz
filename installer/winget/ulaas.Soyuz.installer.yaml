    AppsAndFeaturesEntries:
      - DisplayName: Soyuz
        Publisher: The Soyuz contributors
        UpgradeCode: "{4D03F89E-9D28-4139-AA95-0E950320AF14}"
ManifestType: installer
ManifestVersion: 1.9.0
