ShortDescription: A keyboard-first file explorer.
Description: |-
  Soyuz is a keyboard-first file explorer written in Rust with egui. Every copy, move, delete,
  extract or checksum runs as a background job with progress, pause / resume / cancel,
  conflict handling, history and undo, so the window never stops responding. Tabs, dual and
  quad panes, a command palette, archives browsed like folders, remote locations (SFTP,
  WebDAV, FTP, S3), an integrated terminal and a terminal UI (soyuz-tui). No telemetry.
