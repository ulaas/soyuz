[package]
name = "soyuz-tui"
description = "Soyuz terminal UI (`soyuz-tui`, `soyuz --tui`): a ratatui frontend on the soyuz-appcore core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
readme = "../../README.md"
build = "build.rs"

# Like soyuz-appcore, no GUI toolkit (egui / eframe / winit / wgpu …): `tests/boundary.rs`
# checks the resolved dependency graph.

# `soyuz-tui [PATH]`: the terminal UI as a console program of its own (on Windows a
# console-subsystem exe, so it runs in the terminal it is started from). Ships next to
# `soyuz` in every package.
[[bin]]
name = "soyuz-tui"
path = "src/main.rs"

[features]
# Same defaults as `soyuz-app` for the standalone binary; `soyuz-app` turns these on
# itself (the workspace dependency has `default-features = false`).
default = ["zstd", "pdf"]
pdf = ["soyuz-appcore/pdf"]
zstd = ["soyuz-appcore/zstd"]

[dependencies]
soyuz-appcore.workspace = true
soyuz-core.workspace = true
soyuz-fs.workspace = true
soyuz-jobs.workspace = true
# The embedded terminal pane and suspend-to-shell (Phase T5): the toolkit-free API only
# (no `egui` feature; it is unified on under `cargo test --workspace`, never relied on).
soyuz-term.workspace = true
ratatui.workspace = true
crossterm.workspace = true
# Images (`[tui] images`, Phase T4: `view/preview.rs`, `images.rs`).
ratatui-image.workspace = true
# Pixels for `images` (scaling, half-blocks); the version soyuz-appcore uses.
image.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
log.workspace = true
# Config values of the settings editor (`soyuz_appcore::models::settings_draft`, Phase T6).
toml.workspace = true
# The AI panel's tools menu and budget warning (`soyuz_ai::tools::catalog`,
# `soyuz_ai::pricing::current_month`, `soyuz_mcp::client::ServerStatus`) and plan arguments
# as JSON (the plan JSON editor); all were dev-dependencies, so the lockfile is unchanged.
soyuz-ai.workspace = true
soyuz-mcp.workspace = true
serde_json.workspace = true
# Display widths and grapheme clusters for truncation and the line editor (`view/text.rs`,
# `widgets/line_edit.rs`); the versions ratatui already resolves.
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
# The unlock dialog's passphrase (`input/dialogs/unlock_device.rs`, Phase T7): wiped on
# submit and on drop, like the GUI's `unlock_volume.rs`; already in the lockfile.
zeroize.workspace = true

# SIGTERM / SIGHUP / SIGINT / SIGCONT (`signals.rs`); already in the lockfile (via
# alacritty_terminal).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.5"

[dev-dependencies]
tempfile.workspace = true
# MCP approval requests and script plans in the dialog tests (`input/dialogs/approval_*.rs`).
soyuz-script.workspace = true

[build-dependencies]
# Embeds the icon + version info into soyuz-tui.exe (Windows hosts with rc.exe only; no-op elsewhere).
winresource = { version = "0.1.31", default-features = false }

[lints]
workspace = true
