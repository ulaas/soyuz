[package]
name = "soyuz-fs"
description = "Soyuz platform filesystem layer (raw OS calls, no shell backends)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Fault injection for torture tests (`soyuz_fs::fault`): zero cost when off.
fault-inject = []
# Expose untrusted-data parsers to the `fuzz/` targets (`soyuz_fs::fuzzing`).
fuzzing = []

[dependencies]
soyuz-core.workspace = true
bitflags.workspace = true
serde.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
log.workspace = true
blake3.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
crc32fast.workspace = true
chrono.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Environment",
] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
libc.workspace = true
xattr.workspace = true
filetime.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
