[package]
name = "soyuz-fs"
description = "Soyuz platform filesystem layer (raw OS calls, no shell backends)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Fault injection for torture tests (`soyuz_fs::fault`): zero cost when off.
fault-inject = []
# Expose untrusted-data parsers to the `fuzz/` targets (`soyuz_fs::fuzzing`).
fuzzing = []

[dependencies]
soyuz-core.workspace = true
bitflags.workspace = true
serde.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
log.workspace = true
blake3.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
crc32fast.workspace = true
chrono.workspace = true
serde_json.workspace = true
# Typed window / display handles for the Wayland drop target (`dragout`), so callers
# never pass raw pointers as integers. Same version eframe already uses.
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_Security_Authorization",
    # Authenticode check of downloaded updates (WinVerifyTrust; wintrust.dll, not shell).
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    # Drag-out to other apps: OLE DoDragDrop with a hand-written IDataObject / IDropSource
    # (ole32 + kernel32 global memory + user32 clipboard format names; no shell).
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Graphics_Dwm",
    # GetUserDefaultUILanguage + LCIDToLocaleName (UI language for `general.language = "auto"`).
    "Win32_Globalization",
    # FileTimeToDosDateTime / DosDateTimeToFileTime (Explorer thumbnail cache ids).
    "Win32_System_WindowsProgramming",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    # Per-monitor DPI of owned popup windows (user32).
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_Storage_FileSystem",
    "Wdk_Foundation",
] }

[target.'cfg(unix)'.dependencies]
# `mm`: read-only font mappings (`sys/mmap.rs`).
rustix = { workspace = true, features = ["mm"] }
libc.workspace = true
xattr.workspace = true
filetime.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true

[[bench]]
name = "listing"
harness = false

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
skrifa.workspace = true
# External drag and drop: Wayland drop target on the window's own connection
# (`sys/linux/wayland_dnd.rs`) and the X11 XDND drag source (`sys/linux/xdnd.rs`).
x11rb.workspace = true
wayland-client.workspace = true
wayland-backend.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Font `name` tables (same parser as Linux, over CoreText's font file list).
skrifa.workspace = true
# CoreFoundation / LaunchServices / CoreText FFI (`sys/macos/`), AppKit pasteboard and
# Finder reveal.
core-foundation.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
