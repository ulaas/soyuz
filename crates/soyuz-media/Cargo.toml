[package]
name = "soyuz-media"
description = "Soyuz media layer: the FFmpeg libraries loaded at run time (probe, frames, audio, playback, transcoding)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# No soyuz-core, no audio device, no GUI toolkit: the crate's tests run headless and the
# frontends adapt its closures / traits (`FrameSink`, `AudioOutput`) themselves.
[dependencies]
libloading.workspace = true
image.workspace = true
log.workspace = true
serde.workspace = true
thiserror.workspace = true

[features]
# Hidden test seams (fault injection, queue introspection: `player::seams`) for this
# crate's own tests, switched on by the self dev-dependency below; never in a normal build.
test-seams = []

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
soyuz-media = { path = ".", features = ["test-seams"] }

[lints]
workspace = true
