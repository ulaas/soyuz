[package]
name = "soyuz-term"
description = "Soyuz embedded terminal widget (alacritty_terminal + egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Expose parsers / encoders to the `fuzz/` targets (`soyuz_term::fuzzing`).
fuzzing = []

[dependencies]
egui.workspace = true
alacritty_terminal.workspace = true
polling.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# `proc_pidinfo(PROC_PIDVNODEPATHINFO)`: the shell's working directory without integration.
libc.workspace = true

[dev-dependencies]
eframe.workspace = true

[lints]
workspace = true
