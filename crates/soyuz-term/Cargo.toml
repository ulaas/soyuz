[package]
name = "soyuz-term"
description = "Soyuz embedded terminal: toolkit-free alacritty_terminal backend, egui widget behind the `egui` feature"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Toolkit-free by default (a text UI can use the backend); the GUI enables `egui`.
default = []
# The egui widget (`TerminalView`, `TermTheme`, key encoding, `egui_wake`).
egui = ["dep:egui"]
# Expose parsers / encoders to the `fuzz/` targets (`soyuz_term::fuzzing`).
fuzzing = ["egui"]

[dependencies]
egui = { workspace = true, optional = true }
alacritty_terminal.workspace = true
polling.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
log.workspace = true

[dev-dependencies]
eframe.workspace = true

[[example]]
name = "term_demo"
required-features = ["egui"]

[lints]
workspace = true
