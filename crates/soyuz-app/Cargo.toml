[package]
name = "soyuz-app"
description = "Soyuz file explorer application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

default-run = "soyuz"

[[bin]]
name = "soyuz"
path = "src/main.rs"

[features]
default = ["zstd"]
# Fallback OpenGL renderer (`--renderer glow`).
glow = ["eframe/glow"]
# Native zstd (tar.zst writing, zstd zip entries); compiles C. Cross builds without a C
# cross compiler use `--no-default-features`.
zstd = ["soyuz-archive/zstd"]

[dependencies]
soyuz-core.workspace = true
soyuz-fs.workspace = true
soyuz-jobs.workspace = true
soyuz-archive.workspace = true
soyuz-search.workspace = true
soyuz-term.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui-phosphor.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
toml.workspace = true
image.workspace = true
syntect.workspace = true
nucleo-matcher.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
