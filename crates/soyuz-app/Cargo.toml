[package]
name = "soyuz-app"
description = "Soyuz file explorer application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["file-manager", "explorer", "egui"]
categories = ["filesystem", "gui"]

default-run = "soyuz"
build = "build.rs"

[[bin]]
name = "soyuz"
path = "src/main.rs"

[features]
default = ["zstd", "pdf"]
# PDF page rendering through pdfium (loaded at runtime from pdfium.dll next to the exe or
# in the config dir; see docs/USER_GUIDE.md). Without the library the preview falls back
# to the pure-Rust text-only view.
pdf = ["dep:pdfium-render"]
# Fallback OpenGL renderer (`--renderer glow`).
glow = ["eframe/glow"]
# Native zstd (tar.zst writing, zstd zip entries); compiles C. Cross builds without a C
# cross compiler use `--no-default-features`.
zstd = ["soyuz-archive/zstd"]

[dependencies]
soyuz-core.workspace = true
soyuz-fs.workspace = true
soyuz-jobs.workspace = true
soyuz-archive.workspace = true
soyuz-search.workspace = true
soyuz-index.workspace = true
soyuz-term.workspace = true
soyuz-ai.workspace = true
soyuz-mcp.workspace = true
soyuz-script.workspace = true
soyuz-vfs.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui-phosphor.workspace = true
resvg.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
image.workspace = true
base64.workspace = true
syntect.workspace = true
nucleo-matcher.workspace = true
regex.workspace = true
memchr.workspace = true
chrono.workspace = true
blake3.workspace = true
pdfium-render = { workspace = true, optional = true }
lopdf.workspace = true
quick-xml.workspace = true
skrifa.workspace = true
ab_glyph.workspace = true
gltf.workspace = true
symphonia.workspace = true
rodio.workspace = true
similar.workspace = true
zip.workspace = true
flate2.workspace = true
# Update check: GitHub Releases JSON + asset download, rustls/ring only.
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true
sha2.workspace = true
# Localization.
fluent-bundle.workspace = true
fluent-langneg.workspace = true
intl-memoizer.workspace = true
unic-langid.workspace = true

[target.'cfg(windows)'.dependencies]
# HWND of the eframe window for the DWM / Snap Layouts integration (`ui::native_chrome`).
raw-window-handle = "0.6.2"
# Raw clipboard access (CF_HDROP file lists): user32/kernel32 only, no shell APIs.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Session-bus service `org.freedesktop.FileManager1` (`services::filemanager1`).
zbus.workspace = true
# Native file clipboard: X11 selections (pure-Rust connection) and the Wayland
# `ext-data-control-v1` protocol (`services::os_clipboard_*`).
x11rb.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
# `user.xdg.tags` (freedesktop tags shared with Dolphin / Baloo, `services::tags`).
xattr.workspace = true
# `[linux] window_backend`: `EventLoopBuilderExt{X11,Wayland}` for eframe's event-loop
# hook. Same version eframe already uses (no new crate in the lockfile).
winit = { version = "0.30.13", default-features = false }
# wl_display / wl_surface / X11 window of the eframe window for external drag and drop
# (`ops::fileops::linux_dnd`).
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
xattr.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true

[[bench]]
name = "thumbs"
harness = false

[build-dependencies]
# Embeds the icon + version info into soyuz.exe (Windows hosts with rc.exe only; no-op elsewhere).
winresource = { version = "0.1.31", default-features = false }

# `cargo deb -p soyuz-app` (Debian / Ubuntu package).
[package.metadata.deb]
name = "soyuz"
maintainer = "The Soyuz contributors"
copyright = "Aydemir Şahin and the Soyuz contributors, MIT"
extended-description = "A keyboard-first, non-blocking file explorer with tabs, dual panes, background jobs with undo, an integrated terminal, previews, search and archive browsing."
section = "utils"
priority = "optional"
depends = "$auto, libxkbcommon0, libfontconfig1"
assets = [
    ["target/release/soyuz", "usr/bin/", "755"],
    ["assets/soyuz.desktop", "usr/share/applications/", "644"],
    ["../../installer/linux/icons/hicolor/16x16/apps/soyuz.png", "usr/share/icons/hicolor/16x16/apps/soyuz.png", "644"],
    ["../../installer/linux/icons/hicolor/22x22/apps/soyuz.png", "usr/share/icons/hicolor/22x22/apps/soyuz.png", "644"],
    ["../../installer/linux/icons/hicolor/24x24/apps/soyuz.png", "usr/share/icons/hicolor/24x24/apps/soyuz.png", "644"],
    ["../../installer/linux/icons/hicolor/32x32/apps/soyuz.png", "usr/share/icons/hicolor/32x32/apps/soyuz.png", "644"],
    ["../../installer/linux/icons/hicolor/48x48/apps/soyuz.png", "usr/share/icons/hicolor/48x48/apps/soyuz.png", "644"],
    ["../../installer/linux/icons/hicolor/64x64/apps/soyuz.png", "usr/share/icons/hicolor/64x64/apps/soyuz.png", "644"],
    ["../../installer/linux/icons/hicolor/128x128/apps/soyuz.png", "usr/share/icons/hicolor/128x128/apps/soyuz.png", "644"],
    ["../../installer/linux/icons/hicolor/256x256/apps/soyuz.png", "usr/share/icons/hicolor/256x256/apps/soyuz.png", "644"],
    ["../../installer/linux/icons/hicolor/512x512/apps/soyuz.png", "usr/share/icons/hicolor/512x512/apps/soyuz.png", "644"],
    ["../../installer/linux/io.github.ulaas.Soyuz.metainfo.xml", "usr/share/metainfo/io.github.ulaas.Soyuz.metainfo.xml", "644"],
    ["../../README.md", "usr/share/doc/soyuz/README.md", "644"],
]

# `cargo bundle -p soyuz-app --release` (macOS .app, also .deb / .msi via cargo-bundle).
[package.metadata.bundle]
name = "Soyuz"
identifier = "dev.soyuz.explorer"
icon = ["assets/icon.png"]
category = "public.app-category.utilities"
short_description = "Keyboard-first, non-blocking file explorer"
long_description = "Tabs, dual panes, background jobs with undo, an integrated terminal, previews, search and archive browsing."
copyright = "Aydemir Şahin and the Soyuz contributors, MIT"

[lints]
workspace = true
