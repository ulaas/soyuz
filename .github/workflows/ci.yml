name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_ffmpeg:
        description: "Rebuild the FFmpeg runtime even if the cache has one for these pins"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Soyuz never uses shell32 / the COM shell: fail fast if anything sneaks in.
  no-shell32:
    name: No shell APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Forbid Win32_UI_Shell feature
        shell: bash
        run: |
          if grep -n "Win32_UI_Shell" Cargo.toml crates/*/Cargo.toml; then
            echo "::error::windows-sys feature Win32_UI_Shell is banned"
            exit 1
          fi
      - name: Forbid shell API names in crates/
        shell: bash
        run: |
          if grep -rnIiE "shell32|IFileOperation|ShellExecute|SHFileOperation|CoInitialize|url\.dll|rundll32|FileProtocolHandler|SHGetFileInfo|IShellItem|IFileDialog" crates/; then
            echo "::error::shell / COM shell APIs are banned in crates/"
            exit 1
          fi
      # `unsafe` is denied workspace-wide; the files that opt a module back in are listed in
      # scripts/unsafe-allowlist.txt (CLAUDE.md names the modules). A new allow site must be
      # added there deliberately, in the same change.
      - name: Unsafe allowlist
        shell: bash
        run: |
          grep -rlI "allow(unsafe_code)" crates/ | sort > /tmp/unsafe-sites.txt
          if ! diff -u scripts/unsafe-allowlist.txt /tmp/unsafe-sites.txt; then
            echo "::error::allow(unsafe_code) sites differ from scripts/unsafe-allowlist.txt"
            exit 1
          fi

  # No credentials in the repository, ever: gitleaks over the full history on every push and
  # pull request (deliberate test fixtures are allow-listed in .gitleaks.toml). The release
  # binary is pinned by version and verified against its published SHA-256.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact -c .gitleaks.toml .

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Build, test, clippy (${{ matrix.os }})
    needs: no-shell32
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Windows and Linux tests are a gate. macOS is verified on real machines and is built
      # and linted here; its tests become a gate once they are confirmed green on hosted
      # runners, until then failures there are reported as warnings.
      - name: Test
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: cargo test --workspace --locked
      - name: Test each crate in isolation
        continue-on-error: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          for c in soyuz-core soyuz-fs soyuz-jobs soyuz-archive soyuz-search soyuz-term soyuz-appcore soyuz-tui soyuz-app; do
            echo "::group::cargo test -p $c"
            cargo test -p "$c" --locked
            echo "::endgroup::"
          done
      # Terminal UI snapshots that differ on this OS (crates/soyuz-tui/src/snapshot.rs):
      # bless from these files without that OS. `always()`: the macOS test steps above
      # continue on error, so `failure()` would never fire there.
      - name: Upload changed terminal UI snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-snapshots-${{ matrix.os }}
          path: crates/soyuz-tui/tests/snapshots/*.new
          if-no-files-found: ignore
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (optional features)
        run: cargo clippy -p soyuz-app --features glow --locked -- -D warnings
      # The pure-Rust build (no zstd C code) must stay warning-free too.
      - name: Clippy (no default features, Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo clippy -p soyuz-appcore --no-default-features --all-targets --locked -- -D warnings
          cargo clippy -p soyuz-tui --no-default-features --all-targets --locked -- -D warnings
          cargo clippy -p soyuz-app --no-default-features --all-targets --locked -- -D warnings
      # The application core and the terminal UI never depend on a GUI toolkit (also tests:
      # crates/soyuz-{appcore,tui}/tests/boundary.rs); the graph is checked for every target.
      - name: Core and terminal UI have no GUI toolkit
        shell: bash
        run: |
          for c in soyuz-appcore soyuz-tui; do
            if cargo tree --locked -p "$c" -e normal --target all | grep -i -E "egui|eframe|epaint|winit|wgpu"; then
              echo "::error::$c must not depend on a GUI toolkit"
              exit 1
            fi
          done
      # The dependency graph must not pull in a shell-wrapping crate (deny.toml [bans]): on
      # Windows they wrap the shell, on Linux they spawn xdg-open / gio instead of the
      # native XDG implementation in soyuz-fs.
      - name: Banned crates (target graph)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then target=x86_64-pc-windows-msvc; else target=x86_64-unknown-linux-gnu; fi
          for c in trash rfd open opener webbrowser native-dialog tinyfiledialogs; do
            if cargo tree --locked --target "$target" -e normal -i "$c" >/dev/null 2>&1; then
              echo "::error::crate '$c' wraps the system shell / xdg-open and is banned"
              cargo tree --locked --target "$target" -e normal -i "$c"
              exit 1
            fi
          done

  # The FFmpeg runtime (Phase V): the five LGPL shared libraries Soyuz loads at run time,
  # built by scripts/ffmpeg-build.sh from the tarballs pinned in third_party/ffmpeg/pins.env.
  # Built once per pin change (the cache key hashes the pins and the script; a miss costs
  # 10-20 minutes per target), then uploaded as artifacts for the media job and the packages.
  # Linux and Windows (mingw-w64 cross) build on Ubuntu, the universal macOS slice on the
  # arm64 runner. The job also compiles third_party/ffmpeg/layout_probe.c against the built
  # headers (the Windows probe is cross-compiled here and run on the Windows media leg).
  ffmpeg:
    name: FFmpeg runtime (${{ matrix.target }})
    needs: no-shell32
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux64, os: ubuntu-latest }
          - { target: win64, os: ubuntu-latest }
          - { target: macos-universal, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      OUT: ffmpeg-out/${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore the runtime for these pins
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-out/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('third_party/ffmpeg/pins.env', 'scripts/ffmpeg-build.sh') }}${{ inputs.rebuild_ffmpeg == true && format('-{0}', github.run_id) || '' }}
      - name: Install the build tools (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git tar xz-utils gnupg \
            nasm meson ninja-build pkg-config cmake patchelf binutils \
            zlib1g-dev libva-dev libdrm-dev \
            mingw-w64 libz-mingw-w64-dev
      - name: Install the build tools (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          # bash 4+ for scripts/ffmpeg-build.sh (macOS's /bin/bash is 3.2), first on PATH
          brew install bash nasm meson ninja pkgconf
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash scripts/ffmpeg-build.sh "${{ matrix.target }}" "$OUT" \
            --work "$RUNNER_TEMP/ffmpeg-work" --downloads "$RUNNER_TEMP/ffmpeg-downloads"
      - name: Layout probe (C offsetof of every field soyuz-media reads)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == win64 ]]; then
            sudo apt-get update >/dev/null && sudo apt-get install -y --no-install-recommends mingw-w64 >/dev/null
            x86_64-w64-mingw32-gcc -static -I "$OUT/include" -o "$OUT/layout_probe.exe" third_party/ffmpeg/layout_probe.c
          else
            cc -I "$OUT/include" -o "$OUT/layout_probe" third_party/ffmpeg/layout_probe.c
            "$OUT/layout_probe" | tail -n 1
          fi
      - name: Show the build record
        shell: bash
        run: |
          ls -la "$OUT"
          cat "$OUT/BUILD.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.target }}
          path: |
            ffmpeg-out/${{ matrix.target }}
            !ffmpeg-out/${{ matrix.target }}/sources
          if-no-files-found: error
      # The input archives (the LGPL "complete corresponding source"), once.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target == 'linux64'
        with:
          name: ffmpeg-sources
          path: ffmpeg-out/linux64/sources
          if-no-files-found: error

  # With-libraries tests on every OS: SOYUZ_MEDIA_TESTS=1 turns a missing runtime into a
  # failure, SOYUZ_FFMPEG_DIR points at the artifact. The layout oracle compares the C
  # offsetof() output with the #[repr(C)] prefix structs in soyuz-media (SOYUZ_FFMPEG_LAYOUT).
  media:
    name: Media tests with the FFmpeg runtime (${{ matrix.os }})
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win64 }
          - { os: ubuntu-latest, target: linux64 }
          - { os: macos-latest, target: macos-universal }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SOYUZ_FFMPEG_DIR: ${{ github.workspace }}/ffmpeg-rt
      SOYUZ_MEDIA_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev \
            libva2 libva-drm2 libdrm2
          # ^ the VAAPI build's libavutil links libva / libdrm (ordinary requires of the packages)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-rt
      - name: Layout oracle (C offsetof vs. the Rust tables)
        shell: bash
        env:
          SOYUZ_FFMPEG_LAYOUT: ${{ github.workspace }}/layout.json
        run: |
          set -euo pipefail
          probe=ffmpeg-rt/layout_probe
          [[ "$RUNNER_OS" == Windows ]] && probe=ffmpeg-rt/layout_probe.exe
          chmod +x "$probe"
          "$probe" > layout.json
          tail -n 1 layout.json
          cargo test -p soyuz-media --locked -- layout
      - name: Tests with the runtime
        shell: bash
        run: cargo test -p soyuz-media -p soyuz-appcore -p soyuz-jobs --locked

  # A second FFmpeg major, for free: Debian 13 ships 7.1 (avcodec 61). Only the runtime
  # packages are installed for the tests (nothing of Soyuz links FFmpeg); the -dev headers
  # come in afterwards, for the C layout probe only, once every Rust build step is done.
  media-v7:
    name: Media tests with FFmpeg 7.1 (Debian 13)
    needs: no-shell32
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    env:
      SOYUZ_FFMPEG_DIR: /usr/lib/x86_64-linux-gnu
      SOYUZ_MEDIA_TESTS: "1"
    steps:
      - name: Install the 7.1 runtime libraries and a C toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libavcodec61 libavformat61 libavutil59 libswscale8 libswresample5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tests with the distribution's 7.1 libraries
        run: cargo test -p soyuz-media --locked
      - name: Layout oracle against the 7.1 headers
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev
          cc -o "$RUNNER_TEMP/layout_probe" third_party/ffmpeg/layout_probe.c
          "$RUNNER_TEMP/layout_probe" > "$RUNNER_TEMP/layout.json"
          tail -n 1 "$RUNNER_TEMP/layout.json"
          SOYUZ_FFMPEG_LAYOUT="$RUNNER_TEMP/layout.json" cargo test -p soyuz-media --locked -- layout

  # Keyboard-only GUI test: launches the real window on the runner's desktop
  # session and drives it with synthetic key events only (`SOYUZ_SCRIPT` `keys:` steps),
  # in English and Turkish. Hosted runners have no GPU, so wgpu is pointed at the WARP
  # software adapter (DX12). If the window never comes up the test skips with a warning
  # annotation; set `SOYUZ_GUI_TESTS: require` below to make that a failure once the job
  # has proven stable on hosted runners.
  gui-keyboard:
    name: Keyboard-only GUI test (windows)
    needs: no-shell32
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WGPU_BACKEND: dx12
      WGPU_ADAPTER_NAME: Microsoft Basic Render Driver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Keyboard-only test
        run: cargo test -p soyuz-app --test keyboard_only --locked -- --ignored --nocapture --test-threads 1

  # Release binaries for every desktop OS (pushes to main and manual runs), downloadable
  # from the run's Artifacts: Windows x64 (.zip), Linux x64 (.tar.gz), macOS arm64
  # (.tar.gz, unsigned: Gatekeeper needs `xattr -d com.apple.quarantine soyuz` or
  # right-click > Open). Each holds `soyuz` and `soyuz-tui` (the terminal UI) and the
  # FFmpeg runtime libraries (from the ffmpeg job).
  package:
    name: Package (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: [build, ffmpeg]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, ffmpeg: win64 }
          - { name: linux-x64, os: ubuntu-latest, ffmpeg: linux64 }
          - { name: macos-arm64, os: macos-latest, ffmpeg: macos-universal }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-${{ matrix.ffmpeg }}
          path: ffmpeg-rt
      - name: Build and package
        if: runner.os != 'Linux'
        shell: pwsh
        run: ./scripts/package.ps1 -FfmpegDir ffmpeg-rt
      # Linux: relocatable PREFIX tree (bin, desktop entry, hicolor icons, metainfo, lib/soyuz).
      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/package.sh --ffmpeg-dir ffmpeg-rt
      # Both executables are in every package; the terminal UI binary must start.
      - name: soyuz-tui --version
        shell: bash
        run: target/release/soyuz-tui --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soyuz-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  # Criterion benchmarks in quick mode: listing 100k entries, natural sort 1M,
  # thumbnail decode + downscale, search throughput. Windows only for now. On pull requests
  # the base branch is benchmarked first and changes over 15% are reported as warnings
  # (shared runners are too noisy for a hard gate).
  bench:
    name: Benchmarks (quick, windows)
    needs: no-shell32
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Baseline (pull request base)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git worktree add ../soyuz-base "origin/${{ github.base_ref }}"
          Push-Location ../soyuz-base
          $env:CARGO_TARGET_DIR = "${{ github.workspace }}/target"
          cargo bench --workspace --bench "*" --locked -- --quick --save-baseline base
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::baseline benches failed on the base branch" }
          Pop-Location
          exit 0
      - name: Benchmarks
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            cargo bench --workspace --bench "*" --locked -- --quick --baseline-lenient base
          } else {
            cargo bench --workspace --bench "*" --locked -- --quick
          }
      - name: Report changes over 15%
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Get-ChildItem target/criterion -Recurse -Filter estimates.json |
            Where-Object { $_.Directory.Name -eq 'change' } |
            ForEach-Object {
              $mean = (Get-Content $_.FullName | ConvertFrom-Json).mean.point_estimate
              $name = $_.Directory.Parent.FullName.Substring((Resolve-Path target/criterion).Path.Length + 1)
              $pct = [math]::Round($mean * 100, 1)
              if ($mean -gt 0.15) { Write-Output "::warning::$name regressed by $pct%" } else { Write-Output "$name $pct%" }
            }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-windows
          path: target/criterion
          if-no-files-found: ignore
