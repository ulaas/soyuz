name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Soyuz never uses shell32 / the COM shell: fail fast if anything sneaks in.
  no-shell32:
    name: No shell APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Forbid Win32_UI_Shell feature
        shell: bash
        run: |
          if grep -n "Win32_UI_Shell" Cargo.toml crates/*/Cargo.toml; then
            echo "::error::windows-sys feature Win32_UI_Shell is banned"
            exit 1
          fi
      - name: Forbid shell API names in crates/
        shell: bash
        run: |
          if grep -rnIiE "shell32|IFileOperation|ShellExecute|SHFileOperation|CoInitialize|url\.dll|rundll32|FileProtocolHandler|SHGetFileInfo|IShellItem|IFileDialog" crates/; then
            echo "::error::shell / COM shell APIs are banned in crates/"
            exit 1
          fi

  # No credentials in the repository, ever: gitleaks over the full history on every push and
  # pull request (deliberate test fixtures are allow-listed in .gitleaks.toml). The release
  # binary is pinned by version and verified against its published SHA-256.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact -c .gitleaks.toml .

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Build, test, clippy (${{ matrix.os }})
    needs: no-shell32
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Windows and Linux tests are a gate. macOS is built and linted, but its tests are not a
      # gate yet: that code has not been verified on a real machine, so failures there are
      # reported as warnings until the platform is supported.
      - name: Test
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: cargo test --workspace --locked
      - name: Test each crate in isolation
        continue-on-error: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          for c in soyuz-core soyuz-fs soyuz-jobs soyuz-archive soyuz-search soyuz-term soyuz-app; do
            echo "::group::cargo test -p $c"
            cargo test -p "$c" --locked
            echo "::endgroup::"
          done
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (optional features)
        run: cargo clippy -p soyuz-app --features glow --locked -- -D warnings
      # The pure-Rust build (no zstd C code) must stay warning-free too.
      - name: Clippy (no default features, Windows)
        if: runner.os == 'Windows'
        run: cargo clippy -p soyuz-app --no-default-features --all-targets --locked -- -D warnings
      # The dependency graph must not pull in a shell-wrapping crate (deny.toml [bans]): on
      # Windows they wrap the shell, on Linux they spawn xdg-open / gio instead of the
      # native XDG implementation in soyuz-fs.
      - name: Banned crates (target graph)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then target=x86_64-pc-windows-msvc; else target=x86_64-unknown-linux-gnu; fi
          for c in trash rfd open opener webbrowser native-dialog tinyfiledialogs; do
            if cargo tree --locked --target "$target" -e normal -i "$c" >/dev/null 2>&1; then
              echo "::error::crate '$c' wraps the system shell / xdg-open and is banned"
              cargo tree --locked --target "$target" -e normal -i "$c"
              exit 1
            fi
          done

  # Keyboard-only GUI test: launches the real window on the runner's desktop
  # session and drives it with synthetic key events only (`SOYUZ_SCRIPT` `keys:` steps),
  # in English and Turkish. Hosted runners have no GPU, so wgpu is pointed at the WARP
  # software adapter (DX12). If the window never comes up the test skips with a warning
  # annotation; set `SOYUZ_GUI_TESTS: require` below to make that a failure once the job
  # has proven stable on hosted runners.
  gui-keyboard:
    name: Keyboard-only GUI test (windows)
    needs: no-shell32
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WGPU_BACKEND: dx12
      WGPU_ADAPTER_NAME: Microsoft Basic Render Driver
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Keyboard-only test
        run: cargo test -p soyuz-app --test keyboard_only --locked -- --ignored --nocapture --test-threads 1

  # Release binaries for every desktop OS (pushes to main and manual runs), downloadable
  # from the run's Artifacts: Windows x64 (.zip), Linux x64 (.tar.gz), macOS arm64
  # (.tar.gz, unsigned: Gatekeeper needs `xattr -d com.apple.quarantine soyuz` or
  # right-click > Open). macOS binaries are built but untested.
  package:
    name: Package (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev
      - name: Build and package
        if: runner.os != 'Linux'
        shell: pwsh
        run: ./scripts/package.ps1
      # Linux: relocatable PREFIX tree (bin, desktop entry, hicolor icons, metainfo).
      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soyuz-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  # Criterion benchmarks in quick mode: listing 100k entries, natural sort 1M,
  # thumbnail decode + downscale, search throughput. Windows only for now. On pull requests
  # the base branch is benchmarked first and changes over 15% are reported as warnings
  # (shared runners are too noisy for a hard gate).
  bench:
    name: Benchmarks (quick, windows)
    needs: no-shell32
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Baseline (pull request base)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git worktree add ../soyuz-base "origin/${{ github.base_ref }}"
          Push-Location ../soyuz-base
          $env:CARGO_TARGET_DIR = "${{ github.workspace }}/target"
          cargo bench --workspace --bench "*" --locked -- --quick --save-baseline base
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::baseline benches failed on the base branch" }
          Pop-Location
          exit 0
      - name: Benchmarks
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            cargo bench --workspace --bench "*" --locked -- --quick --baseline-lenient base
          } else {
            cargo bench --workspace --bench "*" --locked -- --quick
          }
      - name: Report changes over 15%
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Get-ChildItem target/criterion -Recurse -Filter estimates.json |
            Where-Object { $_.Directory.Name -eq 'change' } |
            ForEach-Object {
              $mean = (Get-Content $_.FullName | ConvertFrom-Json).mean.point_estimate
              $name = $_.Directory.Parent.FullName.Substring((Resolve-Path target/criterion).Path.Length + 1)
              $pct = [math]::Round($mean * 100, 1)
              if ($mean -gt 0.15) { Write-Output "::warning::$name regressed by $pct%" } else { Write-Output "$name $pct%" }
            }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criterion-windows
          path: target/criterion
          if-no-files-found: ignore
