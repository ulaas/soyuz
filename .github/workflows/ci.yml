name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Soyuz never uses shell32 / the COM shell (PLAN §2.1): fail fast if anything sneaks in.
  no-shell32:
    name: No shell APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid Win32_UI_Shell feature
        shell: bash
        run: |
          if grep -n "Win32_UI_Shell" Cargo.toml crates/*/Cargo.toml; then
            echo "::error::windows-sys feature Win32_UI_Shell is banned"
            exit 1
          fi
      - name: Forbid shell API names in crates/
        shell: bash
        run: |
          if grep -rnIiE "shell32|IFileOperation|ShellExecute|SHFileOperation|CoInitialize|url\.dll|rundll32|FileProtocolHandler|SHGetFileInfo|IShellItem|IFileDialog" crates/; then
            echo "::error::shell / COM shell APIs are banned in crates/"
            exit 1
          fi

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Build, test, clippy (${{ matrix.os }})
    needs: no-shell32
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libfontconfig1-dev
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Test each crate in isolation
        shell: bash
        run: |
          for c in soyuz-core soyuz-fs soyuz-jobs soyuz-archive soyuz-search soyuz-term soyuz-app; do
            echo "::group::cargo test -p $c"
            cargo test -p "$c" --locked
            echo "::endgroup::"
          done
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (optional features)
        run: cargo clippy -p soyuz-app --features glow --locked -- -D warnings
      # The pure-Rust build (no zstd C code) must stay warning-free too.
      - name: Clippy (no default features, Windows)
        if: runner.os == 'Windows'
        run: cargo clippy -p soyuz-app --no-default-features --all-targets --locked -- -D warnings
      # The dependency graph must not pull in a shell-wrapping crate (deny.toml [bans]).
      - name: Banned crates (Windows target graph)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for c in trash rfd open opener webbrowser native-dialog tinyfiledialogs; do
            if cargo tree --locked --target x86_64-pc-windows-msvc -e normal -i "$c" >/dev/null 2>&1; then
              echo "::error::crate '$c' wraps the Windows shell and is banned (the project notes)"
              cargo tree --locked --target x86_64-pc-windows-msvc -e normal -i "$c"
              exit 1
            fi
          done

  # Release zip of the Windows build (pushes to main and manual runs).
  package:
    name: Package (windows)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and zip
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: soyuz-windows-x64
          path: dist/*.zip
          if-no-files-found: error
