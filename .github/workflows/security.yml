# Supply-chain checks: cargo-deny (licences, advisories, bans,
# sources; config in deny.toml) and cargo-audit (RustSec advisories). Runs on every change
# to the dependency set, on PRs, and weekly so new advisories against an unchanged
# Cargo.lock are caught.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    # A new advisory must not block unrelated PRs; it still fails the scheduled run.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
          arguments: --all-features

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only allow-listed actions run in this repository: build cargo-audit from crates.io
      # (the cache keeps the binary in ~/.cargo/bin between runs).
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-audit
        run: cargo audit --version || cargo install cargo-audit --locked
      # Vulnerabilities, unsound and yanked crates fail; "unmaintained" notices are shown
      # (transitive ones via syntect are listed in deny.toml). Ignores, if ever needed, go
      # into deny.toml [advisories].ignore AND here via --ignore, each with a reason.
      - name: cargo audit
        run: cargo audit --deny unsound --deny yanked
