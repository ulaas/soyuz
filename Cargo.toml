[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# --- internal crates ---
soyuz-core = { path = "crates/soyuz-core" }
soyuz-fs = { path = "crates/soyuz-fs" }
soyuz-jobs = { path = "crates/soyuz-jobs" }
soyuz-archive = { path = "crates/soyuz-archive" }
soyuz-search = { path = "crates/soyuz-search" }
soyuz-term = { path = "crates/soyuz-term" }

# --- GUI (pinned exactly, see PLAN §7) ---
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland", "persistence"] }
egui = "=0.36.2"
egui_extras = { version = "=0.36.2", features = ["image", "svg", "file", "syntect"] }
egui-phosphor = { version = "=0.14.0", features = ["regular", "fill"] }
egui_kittest = { version = "=0.36.2", features = ["snapshot", "wgpu"] }

# --- platform ---
windows-sys = "0.61.2"
rustix = { version = "1.1.5", features = ["fs", "process"] }
libc = "0.2.190"
xattr = "1.6.1"
filetime = "0.2.29"

# --- concurrency / fs ---
notify = "8.2.0"
notify-debouncer-full = { version = "0.7.0", features = ["crossbeam-channel"] }
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
rayon = "1.12.0"
ignore = "0.4.33"
globset = "0.4.20"
regex = "1.13.1"
nucleo-matcher = "0.3.1"
memmap2 = "0.9.11"

# --- serde / config ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_ignored = "0.1.14"
toml = "1.1.6"
directories = "6.0.0"
bitflags = { version = "2.11.0", features = ["serde"] }

# --- archives ---
zip = { version = "8.6.0", default-features = false, features = ["deflate", "bzip2", "lzma", "xz", "time", "aes-crypto"] }
tar = "0.4.46"
flate2 = "1.1.10"
zstd = "0.13.3"
ruzstd = "0.8.3"
lzma-rust2 = { version = "0.16.2", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
bzip2 = "0.6.1"
sevenz-rust2 = "0.23.0"
infer = "0.22.0"

# --- media / preview ---
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }

# --- hashing ---
blake3 = "1.8.7"
sha2 = "0.10.9"
sha1 = "0.10.6"
md-5 = "0.10.6"
crc32fast = "1.5.0"

# --- terminal ---
alacritty_terminal = "0.26.0"

# --- misc ---
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
humansize = "2.1.3"
thiserror = "2.0.18"
log = "0.4.33"
env_logger = "0.11.8"
tempfile = "3.23.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
