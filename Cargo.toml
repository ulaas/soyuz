[workspace]
resolver = "3"
members = ["crates/*"]
# cargo-fuzz targets: a separate workspace (nightly only), see fuzz/Cargo.toml.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
authors = ["The Soyuz contributors"]

[workspace.dependencies]
# --- internal crates ---
soyuz-core = { path = "crates/soyuz-core" }
soyuz-fs = { path = "crates/soyuz-fs" }
soyuz-jobs = { path = "crates/soyuz-jobs" }
soyuz-archive = { path = "crates/soyuz-archive" }
soyuz-search = { path = "crates/soyuz-search" }
soyuz-term = { path = "crates/soyuz-term" }
soyuz-ai = { path = "crates/soyuz-ai" }
soyuz-mcp = { path = "crates/soyuz-mcp" }
soyuz-index = { path = "crates/soyuz-index" }
soyuz-script = { path = "crates/soyuz-script" }
soyuz-vfs = { path = "crates/soyuz-vfs" }
soyuz-appcore = { path = "crates/soyuz-appcore", default-features = false }
soyuz-tui = { path = "crates/soyuz-tui", default-features = false }

# --- Terminal UI (soyuz-tui) ---
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29.0", features = ["bracketed-paste", "osc52"] }
# Images in the terminal (kitty / sixel / iTerm2 / half-blocks; `[tui] images`).
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }

# --- GUI (pinned exactly) ---
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland", "persistence"] }
egui = "=0.36.2"
egui_extras = { version = "=0.36.2", features = ["image", "svg", "file", "syntect"] }
# SVG icon-pack pictures (same version egui_extras' `svg` feature uses).
resvg = { version = "0.45.1", default-features = false }
egui-phosphor = { version = "=0.14.0", features = ["regular", "fill"] }
egui_kittest = { version = "=0.36.2", features = ["snapshot", "wgpu"] }

# --- platform ---
windows-sys = "0.61.2"
rustix = { version = "1.1.5", features = ["fs", "process", "net", "thread", "pipe"] }
libc = "0.2.190"
# Linux desktop integration (all already in the lockfile via eframe/accesskit/winit).
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = "1.8"
x11rb = "0.13.2"
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
xattr = "1.6.1"
# macOS (all already in the lockfile via eframe/winit/rustls): CoreFoundation wrappers,
# AppKit (NSPasteboard / NSWorkspace) and the Keychain (Security.framework SecItem*).
core-foundation = "0.10.1"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSDictionary", "NSObject", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSWorkspace"] }
security-framework = { version = "3.7.0", default-features = false }
filetime = "0.2.29"

# --- concurrency / fs ---
notify = "8.2.0"
notify-debouncer-full = { version = "0.7.0", features = ["crossbeam-channel"] }
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
rayon = "1.12.0"
ignore = "0.4.33"
globset = "0.4.20"
regex = "1.13.1"
nucleo-matcher = "0.3.1"
memmap2 = "0.9.11"
memchr = "2.8.0"
walkdir = "2.5.0"

# --- serde / config ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_ignored = "0.1.14"
toml = "1.1.6"
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
directories = "6.0.0"
bitflags = { version = "2.11.0", features = ["serde"] }

# --- archives ---
zip = { version = "8.6.0", default-features = false, features = ["deflate", "bzip2", "lzma", "xz", "time", "aes-crypto"] }
tar = "0.4.46"
flate2 = "1.1.10"
zstd = "0.14.0"
ruzstd = "0.9.1"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
bzip2 = "0.6.1"
sevenz-rust2 = "0.23.0"
lzxd = "0.2.7"
# Test fixtures only (CAB writer); reading uses our own CAB parser + `lzxd`.
cab = "0.6.0"
# Pure-Rust RAR decoder (Apache-2.0); reading only: no encoder, recovery or rayon.
rars = { version = "0.10.0", default-features = false, features = ["encryption"] }
infer = "0.22.0"

# --- media / preview ---
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
# Rich previews. pdfium is loaded at runtime (pdfium.dll next to the exe or
# in the config dir); nothing is downloaded or linked at build time.
pdfium-render = { version = "0.9.4", default-features = false, features = ["thread_safe", "pdfium_latest"] }
lopdf = { version = "0.45.0", default-features = false }
quick-xml = "0.42.0"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
ab_glyph = "0.2.32"
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "ogg", "vorbis", "isomp4", "aac", "aiff", "adpcm", "alac"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav", "symphonia-aiff", "symphonia-alac", "symphonia-adpcm"] }
similar = { version = "3.2.0", features = ["inline"] }
base64 = "0.23.1"

# --- hashing ---
blake3 = "1.8.7"
sha2 = "0.10.9"
sha1 = "0.10.6"
md-5 = "0.11.0"
crc32fast = "1.5.0"

# --- terminal ---
alacritty_terminal = "0.26.0"
# Same major as alacritty_terminal's; only for the `EventedReadWrite` signatures (soyuz-term tty_tee).
polling = "3.8"

# --- AI / networking (pure Rust TLS: rustls + ring, no native-tls) ---
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "json", "system-proxy"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1.50.0", default-features = false, features = ["rt-multi-thread", "time", "sync", "macros"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
schemars = "1.2.2"
# MCP (soyuz-mcp): token generation and the `=?base64?…?=` header encoding.
getrandom = "0.3.4"

# --- index: SQLite + FTS5, bundled C amalgamation (public domain; rusqlite MIT) ---
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "functions", "cache"] }

# --- localization: Project Fluent, pure Rust ---
fluent-bundle = "0.16.0"
fluent-langneg = "0.13.1"
intl-memoizer = "0.5.3"
unic-langid = "0.9.6"

# --- misc ---
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
humansize = "2.1.3"
thiserror = "2.0.18"
log = "0.4.33"
env_logger = "0.11.8"
tempfile = "3.23.0"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
# Benchmarks (`cargo bench`); no plotting backend.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true
panic = "unwind"

# accesskit_unix 0.21.1 with a one-line fix so screen readers see Soyuz on at-spi2-core >= 2.62
# (third_party/README.md). Remove once egui depends on accesskit_unix >= 0.23.
[patch.crates-io]
accesskit_unix = { path = "third_party/accesskit_unix" }
