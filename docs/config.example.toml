# Soyuz configuration (config.toml). Every key is optional and has a default;
# unknown keys are reported as warnings. Location: see `soyuz_core::config::default_path()`
# (Windows: %APPDATA%\soyuz\config\config.toml, Linux: ~/.config/soyuz/config.toml,
# macOS: ~/Library/Application Support/soyuz/config.toml, or <exe dir>/portable/config.toml
# when a file named `portable` sits next to the executable). The file is hot-reloaded.

schema = 2

[general]
start_location = "home"          # "home" | "last" | "<path>"
open_folders_in = "same_tab"     # same_tab | new_tab
single_click_open = false
confirm_delete = true            # trash
confirm_permanent_delete = true
show_hidden = false
honour_dot_hidden = true         # also hide names listed in a folder's .hidden file
show_system = false              # Windows system files
show_extensions = true
natural_sort = true
case_insensitive_sort = true
folders_first = true
size_style = "binary"            # binary | decimal | bytes
date_format = "relative"         # relative | short | long | iso | "%Y-%m-%d %H:%M"
default_view = "details"         # details | grid | list | miller | gallery
double_click_speed_ms = 400
language = "auto"                # auto (OS display language) | en-US | tr-TR — switches live
strict_windows_names = false     # apply Windows file-name rules on every OS

[appearance]
theme = "system"                 # system (follows the OS switch live) | dark | light
density = "cozy"                 # compact | cozy | comfortable | touch (large targets)
ui_scale = 1.0
font_size = 13.0
reduced_motion = false
kinetic_scrolling = true         # lists coast after a touch drag / trackpad flick (off with reduced_motion)
rubber_band = true               # trackpad / touch scrolling stretches past the ends and springs back (never the wheel)
toast_time_scale = 0.5           # notification time × this (info 4 s, warning 6 s, error 8 s)
high_contrast = false            # stronger text, borders and focus rings
icon_style = "colored"           # colored | mono
show_thumbnails = true
thumbnail_size = 96
list_end_space = 64              # blank space below the last item (points): room to right-click a full folder
sidebar_width = 220
custom_titlebar = true           # own title bar with the tabs in it (false: system title bar)
backdrop = "none"                # none | mica | acrylic (Windows 11 only; applies at next start)
snap_layouts = true              # Windows 11 Snap Layouts flyout on the maximize button
native_dialogs = true            # dialogs and oversized menus as their own OS windows (false: inside the window)
fallback_fonts = "auto"          # auto (CJK / emoji / Arabic / Hebrew system fonts when a name needs them) | startup | off
color_emoji = true               # emoji in colour (Segoe UI Emoji / Noto Color Emoji); false: monochrome symbol font
color_theme = "orbit"            # orbit | nord | solarized | rose-pine | high-contrast | "<file stem in themes/>"
accent = "theme"                 # theme | system (OS accent color, live) | "#RRGGBB"
extension_badges = true          # extension labels on file icons (grid / gallery)
folder_thumbnails = true         # 2x2 mosaic of the first images inside folders
video_thumbnails = true          # first frame through the FFmpeg libraries ([media])
pdf_thumbnails = true            # first page via pdfium.dll (see [preview] pdfium_dir), when present
os_thumbnail_cache = true        # reuse the system's thumbnails (Windows thumbcache_*.db, Linux ~/.cache/thumbnails; read-only)
write_os_thumbnails = true       # Linux: also write Soyuz-made thumbnails to ~/.cache/thumbnails for other apps (ignored elsewhere)
icon_pack = ""                   # "" = built-in glyphs | "flat" (built-in) | "<folder in icons/>" with a pack.toml
thumb_disk_cache_mib = 256       # on-disk thumbnail cache in thumbs/ (0 = off)

# Fonts per role. `family` = an embedded font (Inter, Inter SemiBold, IBM Plex Sans,
# IBM Plex Sans SemiBold, Noto Sans, Noto Sans SemiBold, Cascadia Mono, JetBrains Mono,
# IBM Plex Mono, Source Code Pro), an installed font as Windows lists it ("Segoe UI",
# "Consolas", "Segoe UI Semibold"; read from C:\Windows\Fonts, never bundled) or a
# .ttf/.otf/.ttc path. A missing font falls back to the role's embedded default.
# `embedded = true` never reads system fonts. `size_offset` adds points (-4 … +8).
# (The old [appearance] font / mono_font keys are still read and moved here.)
[fonts]
hinting = true                   # TrueType hinting: crisper stems at small sizes
subpixel_positioning = true      # smoother letter spacing, slightly softer text
hinting_strength = "crisp"       # crisp (also fits letter widths) | normal (egui's default) | light
text_gamma_dark = 0.45           # coverage → opacity on dark themes: lower = heavier (0 = egui's curve)
text_gamma_light = 0.8           # the same on light themes (1.0 = linear)

[fonts.ui]                       # body text, labels, menus, file names
family = "Inter"
embedded = false
size_offset = 0.0

[fonts.ui_semibold]              # headings, dialog titles, tab labels
family = ""                      # "" = the semibold face of the ui font (Inter SemiBold)

[fonts.terminal]
family = "Cascadia Mono"         # embedded; no ligatures, so `!=` and `->` stay as typed

[fonts.code]                     # text editor, code previews, other monospace text
family = "Cascadia Mono"

[fonts.hex]
family = "Cascadia Mono"

[fonts.numbers]                  # sizes, dates, counters, progress figures
family = ""                      # "" = the ui font ("IBM Plex Sans" / "Noto Sans" have tabular digits)

[theme.colors]                   # optional overrides, hex strings, same names as the design tokens
# accent = "#5B8CFF"
# "bg.window" = "#0F1115"

[layout]
sidebar = true
preview_pane = false
dual_pane = false
dual_pane_orientation = "vertical"   # vertical | horizontal
status_bar = true
tab_strip = "always"             # always | multiple
terminal_height = 260
activity_panel = "right"         # right | bottom | floating
# What focus mode hides (the toolbar and the listing always stay):
focus_mode_hides = ["sidebar", "status_bar", "preview", "bottom_panel", "activity", "ai_panel", "tabs"]

[workspace]                      # windows, tab groups, saved workspaces (workspaces.toml), timeline
new_window = "in_process"        # in_process (Ctrl+N opens a window of this Soyuz) | process
tear_off = true                  # drag a tab out of the strip to open it in its own window
tear_off_distance = 48           # points away from the strip before a tab tears off
close_window_tabs = "ask"        # closing a window with tabs: ask | merge (move them) | close
restore_windows = true           # reopen the other windows (and their positions) with the session
sync_relative = true             # synchronized browsing follows sibling / multi-level moves too
history_graph_limit = 200        # places kept per tab in the "where was I" history graph
timeline_days = 7                # timeline: files changed in the last N days
timeline_scan_folders = 40       # recently visited folders scanned (one level) for changes
timeline_max_items = 1000
timeline_use_index = true        # also ask the search index, when one is available

[toolbar]                        # action names, "|" = separator, "spacer" = flex space
items = ["back", "forward", "up", "|", "breadcrumb", "spacer", "filter", "view_menu", "sort_menu", "toggle_dual_pane", "activity"]

[context_menu]
hide = []                        # action names to hide
order = []                       # optional explicit order; unknown names ignored

[sidebar]
sections = ["favorites", "devices", "portal", "tags", "trash", "network", "cloud", "smart"]   # "trash" = Other; "tree" = disk tree section (mode = "both")
mode = "places"                  # places | tree (disk tree fills the sidebar) | both (tree = the "tree" section)
tree_follow = true               # expand the tree to the active pane's folder
tree_drag_expand_ms = 700        # drag-hover over a collapsed folder expands it (0 = never)
gtk_bookmarks = true             # Linux: show GTK bookmarks (~/.config/gtk-3.0/bookmarks, shared with Nautilus) under Favorites
system_folders = true            # system folders below the favorites, after a divider (its hide button sets this to false)
# Which system folders show (ids of other OSes are ignored). Windows: appdata local_appdata locallow
# programdata program_files program_files_x86 temp public start_menu startup fonts hosts windows
# soyuz_config. Linux: xdg_config xdg_data xdg_cache xdg_state local_bin applications autostart
# flatpak_apps temp etc opt var_log soyuz_config.
system_folder_list = ["appdata", "local_appdata", "programdata", "temp", "xdg_config", "xdg_data", "xdg_cache"]
unmounted_devices = "all"        # Linux: unmounted disks under Devices (click to mount / unlock): all | removable | off
hidden_devices = []              # Linux: devices hidden via "Hide from sidebar" (filesystem UUIDs or /dev paths)
disk_health = true               # This PC's drive cards show SMART / NVMe health; a failing drive raises a warning

[[sidebar.portal]]               # folders pinned to the Portal section (drop folders on it); in order
path = 'C:\Work\Projects'
name = "Projects"                # optional label; empty / missing = the folder's name

[tags]                           # display names of the eight color tags (items stay tagged by color)
names = ["", "", "", "", "", "", "", ""]  # red, orange, yellow, green, cyan, blue, purple, gray; "" = translated color name, max 40 chars
sync_xdg_tags = true             # Linux: mirror tags to the user.xdg.tags extended attribute (Dolphin and others see them)

[columns]
details = ["name", "size", "kind", "modified"]
widths = { name = 320, size = 90, kind = 120, modified = 150 }

[behaviour]
rename_selects = "stem"          # stem | all
paste_conflict = "ask"           # ask | overwrite | skip | keep_both
paste_images = true              # Paste with a picture on the clipboard (screenshot) saves it here as a PNG
clipboard_history = 10           # file sets copied / cut kept for Clipboard history (Ctrl+Alt+V); 0 = off
drag_default = "auto"            # auto (same device = move) | copy | move | ask
remember_folder_views = true
restore_session = true
auto_refresh = true
watch_debounce_ms = 250
watch_poll_interval_ms = 2000    # polling fallback when the OS watch limit is used up
type_ahead = "jump"              # jump | filter
middle_click = "new_tab"         # new_tab | other_pane | nothing
spring_loaded_folders = true     # hovering a folder while dragging opens it
spring_load_delay_ms = 700
drag_out = true                  # dragging items out of the window hands them to other apps

[open]                           # the apps Soyuz opens files with (Enter, double-click, `soyuz open`)
remember_choice = true           # Open with… (Shift+Enter) starts on the app last chosen for the file type
choose_when_unknown = true       # a file no app is registered for (or without an extension) opens Open with… on Enter
run_binaries = true              # Enter on an executable binary / AppImage runs it (Linux); scripts still open in their editor
# last_used = { png = "..." }    # written by Soyuz: last Open with… choice per extension ("." = no extension)

# [[open.default_apps]]          # set from Open with… -> "Always use this app"; first matching rule wins
# extensions = ["mp4", "mkv"]    # without the dot, any case; "tar.gz" matches the end of the name; "." = no extension
# name = "VLC"
# program = 'C:\Program Files\VideoLAN\VLC\vlc.exe'   # macOS: the .app bundle
# args = []                      # "%1" = the file (appended when absent)
# id = ""                        # the registered app it came from (empty: a program by path)

[jobs]
max_parallel = 4
per_device_serial = true
reset_apply_all_between_jobs = true
verify_after_copy = false
copy_buffer_mib = 8
unbuffered_threshold_mib = 256
preserve = ["times", "attrs", "xattr"]   # times | attrs | xattr | acl | owner | sparse
reflink = "auto"                 # auto | never | always
copy_duplicates = "clone"        # files copied twice in one job: clone (ReFS / btrfs / XFS / APFS) | link (hard link) | copy
history_limit = 500
trash_unsupported = "ask"        # ask | permanent | skip
auto_open_activity = true        # open the activity panel when a job runs longer than 1 s
io_stats = true                  # job details start with "Why is this slow?" (speeds, where the time went, what holds it back)

[terminal]
shell = ""                       # "" = auto
args = []
follow_navigation = true
cd_on_tab_switch = true
shell_integration = true         # inject prompt hook so the terminal reports its cwd
escape_returns_focus = true
scrollback = 10000
font_size = 13.0
theme = "auto"                   # auto (derive from app theme) | dark | light
per_tab = false                  # one terminal set per tab instead of one shared set
follow_shell = false             # navigate the focused pane when the shell changes directory
osc52 = "ask"                    # programs setting the clipboard (OSC 52): ask | allow | deny; reads are always denied

[archive]
preserve_special_bits = false    # keep setuid/setgid/sticky bits from archives (unix); off = mask to 0o777
bomb_ratio = 100                 # pause extraction past ratio x archive size (0 = no ratio limit) ...
bomb_floor_mib = 1024            # ... but never below this many MiB
max_entries = 1000000            # pause past this many entries (0 = unlimited)
max_entry_mib = 32768            # pause on a single entry larger than this (0 = unlimited)
edit_level = 6                   # deflate level (0 = store, 1-9) for files added into a zip while browsing it

[search]
threads = 0                      # 0 = auto
respect_gitignore = false
content_max_mib = 8
document_text = true             # content search and the index also read PDF text (files up to [preview] max_document_mib)

[search.index]                   # background index (SQLite + FTS5): instant search + smart folders
enabled = false
roots = ["~"]                    # folders to index
exclude = ["node_modules", ".git", ".hg", ".svn", "target", "__pycache__", ".cache", "$RECYCLE.BIN",
           "System Volume Information", "AppData/Local/Temp", "AppData/Local/Packages",
           "AppData/Local/Microsoft/Windows/INetCache", "AppData/Local/**/Cache", "AppData/Local/**/Code Cache",
           "AppData/Local/**/GPUCache", "AppData/Local/CrashDumps", "AppData/Roaming/**/Cache", "Library/Caches"]
                                 # a name (node_modules, *.tmp) or a path ending (AppData/Local/Temp); Linux/macOS: /x or ~/x is anchored
linux_exclude = [".local/share/Trash", ".var/app/*/cache", ".local/share/containers", ".local/share/Steam",
                 "~/snap", "/proc", "/sys", "/dev", "/run"]
                                 # extra exclusions used only on Linux
content = false                  # index the words of small text files (content: queries)
content_max_kib = 1024
content_extensions = ["txt", "md", "markdown", "rst", "org", "log", "csv", "json", "toml", "yaml", "yml", "ini",
                      "cfg", "xml", "html", "css", "js", "ts", "tsx", "jsx", "rs", "py", "go", "java", "kt", "c",
                      "h", "cpp", "hpp", "cs", "rb", "php", "swift", "sh", "ps1", "bat", "sql", "lua", "tex"]
usn_journal = true               # NTFS: catch up via the change journal (needs administrator rights)
throttle_ms = 2                  # pause after every 1000 crawled entries
smart_refresh_secs = 2           # smart folders refresh at most this often while the index changes
use_for_search = true            # searches inside indexed folders use the index
rescan_interval_secs = 600       # roots that can't be watched (inotify limit) are re-checked this often

[[search.saved]]                 # SavedSearch entries; `query` uses soyuz_search::SearchQuery fields
name = "Large videos"
query = { roots = ["~"], extensions = ["mp4", "mkv"], size = [1073741824, 0] }   # size = [min, max], 0 max = unbounded

[preview]
max_text_kib = 512
max_image_mp = 40
syntax_theme = "auto"
pdf = true                       # needs cargo feature `pdf`; greyed out otherwise
thumb_cache_mib = 128            # memory budget for decoded thumbnails
preview_cache_mib = 96           # memory budget for decoded previews
pdfium_dir = ""                  # folder with pdfium.dll; "" = next to soyuz.exe, then the config dir
office = true                    # docx / xlsx / pptx / odt / ods / odp
epub = true                      # title, author, cover, table of contents
fonts = true                     # ttf / otf / ttc / woff specimen
models = true                    # glTF / GLB / STL / OBJ quick render
model_turntable = true           # spin models until dragged (also off with reduced motion)
audio_waveform = true            # decode audio for a waveform image
audio_playback = true            # play / pause / seek in the preview
video = true                     # metadata, plus a poster frame when the FFmpeg libraries are loaded
diff = true                      # two selected text files -> diff
max_document_mib = 64            # office / epub / pdf parsing limit (per file and per part)
sheet_rows = 200                 # spreadsheet rows read from the first sheet
max_model_mib = 128
max_audio_mib = 512              # no waveform above this size
max_diff_kib = 1024              # each side of a diff is read up to this size
folder_notes = true              # a folder's preview shows its README / notes file, with Edit
folder_notes_files = ["README.md", "README.markdown", "README.txt", "README", "NOTES.md", ".notes.md"]

[media]                          # FFmpeg libraries (loaded at run time), video player, media tools
ffmpeg = true                    # use the libraries when found (bundled, ffmpeg_dir, <config>/ffmpeg, system)
ffmpeg_dir = ""                  # folder searched first for avcodec-63.dll / libavcodec.so.63 / libavcodec.63.dylib
threads = 0                      # decoder (and media-tool encoder) threads per file; 0 = one per core
hw_decode = "auto"               # auto | off | d3d11va | vaapi | videotoolbox (falls back to software)
gpu_yuv = false                  # convert video frames on the GPU (wgpu renderer): own colour matrix, HDR tone mapping
audio_backend = "auto"           # auto (FFmpeg when loaded, else Symphonia) | ffmpeg | symphonia
player = true                    # play videos in the preview pane and Quick Look
autoplay = false                 # start playing when a video is previewed
quicklook_space_plays = false    # Quick Look: Space plays / pauses media (Esc closes); P / K always do
loop = false                     # restart at the end
volume = 80                      # 0-100, written back from the player
muted = false                    # written back from the player
seek_step_secs = 5.0             # Left / Right in the player
max_px = 1280                    # longest edge of decoded frames for the preview pane / Quick Look
tui_fps = 8                      # frames per second drawn as terminal images (soyuz --tui)
poster_secs = 0.0                # poster frame at this many seconds; 0 = a tenth of the duration, at most 5 s
tools = true                     # Convert / Extract audio / Trim / Save frame in menus
faststart = true                 # media tools: MP4 / MOV / M4A index in front of the samples

[editor]                         # "Edit in Soyuz" (F4): text, hex and image editors
dock = "right"                   # right | bottom
font_size = 13.0
tab_width = 4
wrap = false                     # soft-wrap long lines
show_whitespace = false
max_text_mib = 20                # larger text files open read-only in the hex editor
backup_to_trash = true           # put the previous version (<name>.bak) in the trash before overwriting
jpeg_quality = 92                # edited JPEGs are re-encoded (lossy) at this quality
max_image_mp = 200               # largest image the image editor decodes

[git]
status_column = true
refresh_secs = 5

[sync]                           # scheduled sync profiles, two-way sync, previous versions
scheduler = true                 # run profiles on their schedules while Soyuz is open (no OS service)
reports_kept = 20                # run / dry-run reports kept per profile
change_debounce_secs = 10        # "on change" schedules wait this long after the last change
scheduled_dry_run = false        # scheduled runs only write a report of what would change
previous_versions = true         # list Windows Volume Shadow Copies in "Previous versions"
shadow_probe_max = 64            # probe HarddiskVolumeShadowCopy1..N if \Device can't be listed
treemap_diff_content = false     # "Compare as treemap" compares contents byte for byte, not dates and sizes

[updates]                        # update check (manual; nothing installs without a click, no telemetry)
repo = "ulaas/soyuz"             # GitHub "owner/name" or URL; empty = update check disabled
weekly_check = false             # also check once a week at startup (notification only)
include_prereleases = false      # offer release candidates / betas too
[performance]                    # startup and rendering
gpu_backend = "auto"             # auto | dx12 | vulkan | gl (next start; WGPU_BACKEND wins)
[remote]                         # SFTP / WebDAV / FTP(S) / S3 locations; passwords live in the OS credential store
cache_ttl_secs = 30              # reuse a remote folder listing this long (Refresh always re-lists)
poll_secs = 0                    # re-list visible remote folders this often (0 = never)
connect_timeout_secs = 20
io_timeout_secs = 60             # give up when a server stops answering mid-operation
preview_cache_mb = 512           # temp cache for remote files opened / previewed (oldest evicted)
preview_max_mb = 64              # larger remote files are not downloaded just for a preview
share_enumeration = true         # typing \\server or smb://server lists its shares
discover = true                  # Connect to server lists servers announced on the local network (mDNS)
share_minutes = 30               # Quick share stops by itself after this long (0 = when its window closes)
share_port = 0                   # Quick share's port (0 = any free one; fix it to allow it in a firewall)
[linux]                          # Linux desktop integration (ignored elsewhere)
window_backend = "auto"          # auto | wayland | x11 (XWayland: drag and drop with X11 apps; next start)
own_file_manager1 = false        # own org.freedesktop.FileManager1 while running ("Show in folder" opens Soyuz)
clipboard_fallback_tools = false # run wl-copy / xclip when the built-in clipboard fails

[tui]                            # the terminal UI (soyuz --tui)
mouse = true                     # click / wheel in the terminal UI (off keeps the terminal's own text selection)
keyboard_protocol = "auto"       # auto | kitty | legacy (auto: kitty keyboard protocol where supported, never on Windows)
color_mode = "auto"              # auto | truecolor | ansi256 | ansi16 | mono (256 and 16 work too; auto reads COLORTERM / TERM / NO_COLOR)
icons = "unicode"                # nerd | unicode | ascii (nerd needs a Nerd Font in the terminal)
borders = "rounded"              # rounded | plain | ascii | none
sidebar_width = 28               # sidebar width in columns (clamped to 12-60)
osc52 = "auto"                   # auto | always | never (copy text through the terminal with OSC 52, works over SSH)
jobs_rows = 8                    # bottom (jobs) panel height in rows (clamped to 3-30)
images = "auto"                  # auto | kitty | sixel | iterm2 | halfblocks | off
cell_pixels = [10, 20]           # cell size in pixels [width, height] for sixel when the terminal does not report it
preview_ratio = 0.38             # share of the width the preview pane takes (clamped to 0.2-0.6)
shell_mode = "pane"              # pane | suspend (suspend: terminal actions leave the TUI and run your shell; `exit` returns)
terminal_rows = 12               # embedded terminal pane height in rows (clamped to 3-40)
ai_ratio = 0.4                   # share of the width the AI assistant panel takes (clamped to 0.25-0.6)
editor = ""                      # e.g. "nvim" or "code --wait"; empty = $VISUAL, $EDITOR, then nvim / vim / nano / micro / hx / vi on PATH
screen_reader = false            # screen-reader mode: no box drawing, one pane, cursor on the focused item (--screen-reader: one run only)

[ai]                             # AI providers; keys live in the OS credential store
enabled = true
default_profile = "claude"       # used when a task names no profile (empty = first profile)
privacy = "metadata_only"        # none | metadata_only | contents (file contents never leave the machine by default)
request_timeout_secs = 60        # wait for response headers
idle_timeout_secs = 120          # abandon a stream after this long without bytes
max_retries = 3                  # 429 / overloaded / 5xx retries (honours retry-after)
budget_warn_percent = 80         # warn at this share of a profile's monthly cap (hard stop at 100%)

[ai.tasks]
fast = { profile = "local", model = "" }     # naming / classifying (empty model = the profile's model)
strong = { profile = "claude", model = "" }  # planning

[ai.scope]
allowed_roots = []               # folders AI tools may touch (empty = home folder)
blocked = ["**/secrets/**"]      # extra blocked globs; .ssh, .env, keychains, browser profiles, wallets are always blocked
allow_sensitive = false          # true = also allow the built-in sensitive paths
max_read_kib = 256               # read_text size cap

[ai.mcp]                         # Soyuz as an MCP server (Claude Desktop / Code, IDEs, local agents)
server_enabled = true            # `soyuz --mcp` attaches to this running window over a local named pipe (else headless)
http_enabled = false             # Streamable HTTP on 127.0.0.1 (each client needs a bearer token)
http_port = 7863
allowed_origins = []             # extra browser origins; http://localhost:<port> / http://127.0.0.1:<port> always allowed
register_unknown = true          # unknown stdio clients are added as pending (read-only until approved)
approval_timeout_secs = 300      # an unanswered approval card refuses the call after this long
approval_ui = "panel"            # panel (assistant panel's approvals area, opens on request) | dialog (modal plan card)

[[ai.mcp_clients]]               # one per MCP client; manage in Settings → AI assistant → Connections
name = "claude-desktop"          # `soyuz --mcp --mcp-client claude-desktop`
pending = false                  # true = registered on first connect, read-only until approved
token = ""                       # HTTP bearer token reference (credential:<name>); empty = stdio only
allowed_roots = []               # empty = [ai.scope] allowed_roots (always narrowed to them)
max_risk = "write"               # read | write | destructive
require_approval = true          # write / destructive tools show an approval card in Soyuz first

[[ai.mcp_servers]]               # external MCP servers the in-app assistant may use as tools
name = "git"
enabled = false
command = "uvx"                  # stdio: program + args (no shell); or set `url` for Streamable HTTP
args = ["mcp-server-git"]
env = {}
url = ""
token = ""                       # bearer token reference for `url` (credential:<name> | env:<VAR>)
risk = "write"                   # risk class of its tools: read | write | destructive
trust_annotations = false        # true = tools marked readOnlyHint count as read-only
require_approval = true          # tools above read risk need approval in Soyuz
timeout_secs = 60

[ai.agent]                       # in-app assistant harness (Ctrl+I)
max_steps = 24                   # model turns per task
token_budget = 400000            # tokens per task (input + output; 0 = unlimited)
time_limit_secs = 600            # wall-clock limit per task (Esc cancels any time)
max_auto_reads = 60              # read tools the assistant may run on its own per task
compact_after_kib = 96           # summarise old tool results once the conversation is this large
keep_recent_results = 6          # newest tool results kept verbatim when compacting
approval = "always"              # always | auto_write (conflict-free write plans run unasked, never after reading file contents; destructive always asks)
max_risk = "destructive"         # read | write | destructive: highest tool class offered to the model
confirm_cost_usd = 0.5           # ask before a task estimated to cost more (0 = never ask)
listing_entries = 80             # entries of the current folder summarised into the context
redact_cloud = true              # mask e-mails, API keys and tokens in file data sent to cloud providers
name_excerpt_chars = 1500        # "Suggest names": text sent per document (folders with access = "contents"; 0 = metadata only)
vision_max_px = 768              # "Suggest names": longest side of images sent to vision profiles (0 = never send images)
name_max_files = 40              # "Suggest names": most files per request

[[ai.folders]]                   # per-folder AI access, inherited by subfolders (deepest rule wins)
path = "~/Documents/Taxes"
access = "none"                  # none | metadata | contents (cloud content sharing is opt-in per folder)

[[ai.profiles]]
name = "claude"
kind = "anthropic"               # anthropic | openai | openai_responses | gemini | ollama | lm_studio | llama_cpp | vllm | localai | custom
base_url = ""                    # empty = the kind's default
model = "claude-opus-5-5"
key = "credential:anthropic-default"   # credential:<name> (OS credential store) | env:<VAR> | "" (none)
tool_mode = "auto"               # auto (probe) | native | json (constrained JSON tool protocol)
monthly_budget_usd = 20.0        # 0 = no cap
max_tokens = 16000
vision = true                    # the model accepts images ("Suggest names" sends downscaled pictures where allowed)
headers = {}

[[ai.profiles]]
name = "local"
kind = "ollama"
model = "qwen3:8b"

[[ai.prices]]                    # USD per million tokens; `model` is a glob, first match wins
model = "claude-opus-5-5*"
input_per_mtok = 4.0
output_per_mtok = 20.0
cache_read_per_mtok = 0.2
cache_write_per_mtok = 5.0

[keys]
preset = "explorer"              # explorer | commander | finder | vim
cmd_is_ctrl = true
marks = false                    # ranger-style m<key> / '<key> marks in the file list (always on with vim)

[keys.bindings]                  # action = ["chord" or "key sequence", ...]; overrides the preset (and steals the chord)
"copy" = ["Ctrl+C"]
"copy_to_other_pane" = ["F5"]
"settings" = ["Ctrl+,", "Ctrl+K Ctrl+S"]   # a value with spaces is a sequence

[[bookmarks]]
name = "Projects"
path = "E:/source"
hotkey = "Ctrl+1"                # bookmarks 1..9 also open with Alt+1..9
icon = "code"

[[custom_commands]]
name = "Open in VS Code"
command = "code"
args = ["%s"]                    # %p focused path, %s selected paths, %n names, %d dir, %o other pane, %% literal
                                 # (an argument that is exactly %s / %n expands to one argument per item;
                                 #  legacy: %P paths, %D dir, %N name, %E ext, %F first selected)
context = ["file", "dir"]        # file | dir | background (empty = everywhere)
hotkey = ""
terminal = false                 # true = run in the integrated terminal panel instead of detached

[scripting]                      # Rhai scripts in scripts/*.rhai next to this file (Settings → Scripts)
enabled = true
approve_writes = true            # show a script action's planned changes before they run
allow_read = true                # scripts may list / stat / search / read files (capped below)
timeout_ms = 3000                # per action or rule-script call
cell_timeout_ms = 250            # per column value / previewer call
max_operations = 5000000
max_read_kib = 1024
max_list_entries = 10000
disabled = []                    # script file names not loaded, e.g. ["tidy.rhai"]

[automation]                     # rules run while Soyuz is open (Settings → Automations)
enabled = true
dry_run = false                  # every rule only logs what it would do
log_entries = 200                # run-log entries kept per rule

[[automation.rules]]
name = "File PDFs"
enabled = true
watch = "C:/Users/me/Downloads"
recursive = false
glob = "*.pdf"                   # ;-separated globs, empty = any name
regex = ""                       # optional, case-insensitive
kind = "files"                   # files | folders | any
min_size_kib = 0                 # 0 = no bound (also max_size_kib)
max_size_kib = 0
min_age_minutes = 0              # by modification time, 0 = no bound (also max_age_minutes)
max_age_minutes = 0
delay_secs = 3                   # act this long after the item last changed
apply_to_existing = false        # also act on matching items already there when the rule starts
dry_run = false
conflict = "keep_both"           # keep_both | skip | overwrite | ask
actions = [
    { action = "move", to = "C:/Users/me/Documents/PDF" },
    { action = "tag", tag = "blue" },
    # { action = "copy", to = "…" }, { action = "rename", pattern = "{mdate}-{name}" },
    # { action = "trash" }, { action = "script", script = "tidy-downloads" }
]

[cli]                            # soyuz cp | mv | rm | trash | ls | open | reveal | jobs
server_enabled = true            # jobs from the terminal run in (and show in) the open window
