# Scripted fake-provider transcript for the docs screenshots (SOYUZ_AI_FAKE, roadmap A8).
# Used by scripts/screenshots.ps1 on the demo tree from scripts/demo-fixture.ps1.
delay_ms = 15
model = "demo-transcript"

[[turn]]
text = "Let me look at what is in {cwd_name} first."
usage = { input = 1850, output = 42 }
[[turn.call]]
name = "list_dir"
args = { path = "{cwd}" }

[[turn]]
text = "There are 4 camera files named IMG_… next to the landscape shots. I suggest moving them into a \"Phone photos\" folder so the trip folder only keeps the edited pictures. Nothing changes until you approve the plan below."
usage = { input = 2630, output = 118 }
[[turn.call]]
name = "move"
args = { sources = ["{cwd}/IMG_20260613_0331.jpg", "{cwd}/IMG_20260711_0131.jpg", "{cwd}/IMG_20260714_0431.jpg", "{cwd}/IMG_20260812_0231.jpg"], dest_dir = "{cwd}/Phone photos" }
