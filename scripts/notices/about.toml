# cargo-about configuration for THIRD-PARTY-NOTICES.md (regenerate: scripts/notices.ps1).
# Mirrors deny.toml [licenses].allow, so a crate that cargo-deny accepts can be listed.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "OFL-1.1",
    "CC0-1.0",
    "0BSD",
    "bzip2-1.0.6",
    "Ubuntu-font-1.0",
]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# Our own workspace crates (publish = false) are covered by LICENSE, not listed here.
[private]
ignore = true
